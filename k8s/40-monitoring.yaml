# Lightweight monitoring stack for K3s: Prometheus, Alertmanager, Grafana, node-exporter, cAdvisor.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alert.rules.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager.monitoring:9093"]
    scrape_configs:
      - job_name: backend
        metrics_path: /metrics
        static_configs:
          - targets: ["backend.remindercal:8000"]
      - job_name: node
        static_configs:
          - targets: ["node-exporter.monitoring:9100"]
      - job_name: cadvisor
        static_configs:
          - targets: ["cadvisor.monitoring:8080"]
  alert.rules.yml: |
    groups:
      - name: remindercal
        rules:
          - alert: BackendDown
            expr: up{job="backend"} == 0
            for: 1m
            labels: { severity: critical }
            annotations: { summary: "ReminderCal backend is down" }
          - alert: HighCPUUsage
            expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
            for: 5m
            labels: { severity: warning }
            annotations: { summary: "High CPU usage on {{ $labels.instance }}" }
          - alert: HighMemoryUsage
            expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 80
            for: 5m
            labels: { severity: warning }
            annotations: { summary: "High memory usage on {{ $labels.instance }}" }
          - alert: HighDiskUsage
            expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) * 100 > 90
            for: 5m
            labels: { severity: critical }
            annotations: { summary: "Disk almost full on {{ $labels.instance }}" }
          - alert: SlowAPIResponse
            expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_highr_seconds_bucket{job="backend"}[5m]))) > 2
            for: 5m
            labels: { severity: warning }
            annotations: { summary: "p95 API latency above 2s" }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    route:
      receiver: default
      group_by: [alertname]
      repeat_interval: 4h
    receivers:
      - name: default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: monitoring
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: monitoring }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
          ports: [{ containerPort: 9090 }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: monitoring }
spec:
  selector: { app: prometheus }
  ports: [{ port: 9090 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: alertmanager, namespace: monitoring }
spec:
  replicas: 1
  selector: { matchLabels: { app: alertmanager } }
  template:
    metadata: { labels: { app: alertmanager } }
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args: ["--config.file=/etc/alertmanager/alertmanager.yml"]
          ports: [{ containerPort: 9093 }]
          volumeMounts: [{ name: config, mountPath: /etc/alertmanager }]
      volumes:
        - name: config
          configMap: { name: alertmanager-config }
---
apiVersion: v1
kind: Service
metadata: { name: alertmanager, namespace: monitoring }
spec:
  selector: { app: alertmanager }
  ports: [{ port: 9093 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: monitoring }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          ports: [{ containerPort: 3000 }]
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: change-me
          volumeMounts:
            - { name: ds, mountPath: /etc/grafana/provisioning/datasources }
      volumes:
        - name: ds
          configMap: { name: grafana-datasource }
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: monitoring }
spec:
  selector: { app: grafana }
  ports: [{ port: 3000 }]
---
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: node-exporter, namespace: monitoring }
spec:
  selector: { matchLabels: { app: node-exporter } }
  template:
    metadata: { labels: { app: node-exporter } }
    spec:
      hostPID: true
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.8.2
          args: ["--path.rootfs=/host"]
          ports: [{ containerPort: 9100 }]
          volumeMounts:
            - { name: root, mountPath: /host, readOnly: true }
      volumes:
        - name: root
          hostPath: { path: / }
---
apiVersion: v1
kind: Service
metadata: { name: node-exporter, namespace: monitoring }
spec:
  selector: { app: node-exporter }
  ports: [{ port: 9100 }]
---
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: cadvisor, namespace: monitoring }
spec:
  selector: { matchLabels: { app: cadvisor } }
  template:
    metadata: { labels: { app: cadvisor } }
    spec:
      containers:
        - name: cadvisor
          image: gcr.io/cadvisor/cadvisor:v0.49.1
          ports: [{ containerPort: 8080 }]
          securityContext: { privileged: true }
          volumeMounts:
            - { name: rootfs, mountPath: /rootfs, readOnly: true }
            - { name: var-run, mountPath: /var/run, readOnly: true }
            - { name: sys, mountPath: /sys, readOnly: true }
      volumes:
        - { name: rootfs, hostPath: { path: / } }
        - { name: var-run, hostPath: { path: /var/run } }
        - { name: sys, hostPath: { path: /sys } }
---
apiVersion: v1
kind: Service
metadata: { name: cadvisor, namespace: monitoring }
spec:
  selector: { app: cadvisor }
  ports: [{ port: 8080 }]
