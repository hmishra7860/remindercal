apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
# ---------------- Persistent Storage (K3s local-path) ----------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
# ---------------- Prometheus Config & Rules ----------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alert.rules.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager.monitoring:9093"]
    scrape_configs:
      - job_name: backend
        metrics_path: /metrics
        static_configs:
          - targets: ["backend.remindercal:8000"]
      - job_name: node
        dns_sd_configs:
          - names: ["tasks.node-exporter.monitoring.svc.cluster.local"]
            type: A
            port: 9100
      - job_name: cadvisor
        dns_sd_configs:
          - names: ["tasks.cadvisor.monitoring.svc.cluster.local"]
            type: A
            port: 8080
  alert.rules.yml: |
    groups:
      - name: remindercal
        rules:
          - alert: BackendDown
            expr: up{job="backend"} == 0
            for: 1m
            labels: { severity: critical }
            annotations: { summary: "ReminderCal backend is down" }
          - alert: HighCPUUsage
            expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
            for: 5m
            labels: { severity: warning }
            annotations: { summary: "High CPU usage on {{ $labels.instance }}" }
          - alert: HighMemoryUsage
            expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 80
            for: 5m
            labels: { severity: warning }
            annotations: { summary: "High memory usage on {{ $labels.instance }}" }
          - alert: HighDiskUsage
            expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) * 100 > 90
            for: 5m
            labels: { severity: critical }
            annotations: { summary: "Disk almost full on {{ $labels.instance }}" }
          - alert: SlowAPIResponse
            expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_highr_seconds_bucket{job="backend"}[5m]))) > 2
            for: 5m
            labels: { severity: warning }
            annotations: { summary: "p95 API latency above 2s" }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    route:
      receiver: default
      group_by: [alertname]
      repeat_interval: 4h
    receivers:
      - name: default
---
# ---------------- Grafana Provisioning & Dashboard ----------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: monitoring
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: ReminderCal
        type: file
        options:
          path: /var/lib/grafana/dashboards
  remindercal.json: |
    {
      "title": "ReminderCal Overview",
      "uid": "remindercal-overview",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "API request rate (req/s)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [{ "expr": "sum(rate(http_requests_total{job=\"backend\"}[5m])) by (status)", "legendFormat": "{{status}}" }]
        },
        {
          "id": 2, "type": "timeseries", "title": "API latency p95 (s)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [{ "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_highr_seconds_bucket{job=\"backend\"}[5m])))", "legendFormat": "p95" }]
        },
        {
          "id": 3, "type": "timeseries", "title": "Host CPU %",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 8 },
          "targets": [{ "expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "legendFormat": "cpu" }]
        },
        {
          "id": 4, "type": "timeseries", "title": "Host memory %",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 8 },
          "targets": [{ "expr": "(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100", "legendFormat": "memory" }]
        },
        {
          "id": 5, "type": "timeseries", "title": "Container memory (MB)",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 8 },
          "targets": [{ "expr": "sum by (id) (container_memory_working_set_bytes{id=~\"/kubepods.*\"}) / 1024 / 1024", "legendFormat": "{{id}}" }]
        }
      ]
    }
---
# ---------------- Deployments & Services ----------------
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: monitoring }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d"
          ports: [{ containerPort: 9090 }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          persistentVolumeClaim: { claimName: prometheus-data }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: monitoring }
spec:
  type: NodePort
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: 9090, nodePort: 30084, protocol: TCP }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: alertmanager, namespace: monitoring }
spec:
  replicas: 1
  selector: { matchLabels: { app: alertmanager } }
  template:
    metadata: { labels: { app: alertmanager } }
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args: ["--config.file=/etc/alertmanager/alertmanager.yml"]
          ports: [{ containerPort: 9093 }]
          volumeMounts: [{ name: config, mountPath: /etc/alertmanager }]
      volumes:
        - name: config
          configMap: { name: alertmanager-config }
---
apiVersion: v1
kind: Service
metadata: { name: alertmanager, namespace: monitoring }
spec:
  type: NodePort
  selector: { app: alertmanager }
  ports: [{ port: 9093, targetPort: 9093, nodePort: 30085, protocol: TCP }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: monitoring }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          ports: [{ containerPort: 3000 }]
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: change-me # Overridden if you inject a secret
          volumeMounts:
            - { name: grafana-storage, mountPath: /var/lib/grafana }
            - { name: prov, mountPath: /etc/grafana/provisioning/datasources/prometheus.yml, subPath: prometheus.yml }
            - { name: prov, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml, subPath: dashboards.yml }
            - { name: prov, mountPath: /var/lib/grafana/dashboards/remindercal.json, subPath: remindercal.json }
      volumes:
        - name: grafana-storage
          persistentVolumeClaim: { claimName: grafana-data }
        - name: prov
          configMap: { name: grafana-provisioning }
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: monitoring }
spec:
  type: NodePort
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000, nodePort: 30083, protocol: TCP }]
---
# ---------------- DaemonSets (Node Exporter & K3s cAdvisor) ----------------
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: node-exporter, namespace: monitoring }
spec:
  selector: { matchLabels: { app: node-exporter } }
  template:
    metadata: { labels: { app: node-exporter } }
    spec:
      hostPID: true
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.8.2
          args: ["--path.rootfs=/host"]
          ports: [{ containerPort: 9100 }]
          volumeMounts:
            - { name: root, mountPath: /host, readOnly: true }
      volumes:
        - name: root
          hostPath: { path: / }
---
apiVersion: v1
kind: Service
metadata: { name: node-exporter, namespace: monitoring }
spec:
  type: NodePort
  selector: { app: node-exporter }
  ports: [{ port: 9100, targetPort: 9100, nodePort: 30087, protocol: TCP }]
---
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: cadvisor, namespace: monitoring }
spec:
  selector: { matchLabels: { app: cadvisor } }
  template:
    metadata: { labels: { app: cadvisor } }
    spec:
      containers:
        - name: cadvisor
          image: gcr.io/cadvisor/cadvisor:v0.49.1
          args:
            - "--housekeeping_interval=10s"
            - "--docker_only=false"
          ports: [{ containerPort: 8080 }]
          securityContext: { privileged: true }
          volumeMounts:
            - { name: rootfs, mountPath: /rootfs, readOnly: true }
            - { name: var-run, mountPath: /var/run, readOnly: false }
            - { name: sys, mountPath: /sys, readOnly: true }
            - { name: k3s-containerd, mountPath: /run/k3s/containerd, readOnly: true }
            - { name: k3s-data, mountPath: /var/lib/rancher/k3s, readOnly: true }
      volumes:
        - { name: rootfs, hostPath: { path: / } }
        - { name: var-run, hostPath: { path: /var/run } }
        - { name: sys, hostPath: { path: /sys } }
        - { name: k3s-containerd, hostPath: { path: /run/k3s/containerd } }
        - { name: k3s-data, hostPath: { path: /var/lib/rancher/k3s } }
---
apiVersion: v1
kind: Service
metadata: { name: cadvisor, namespace: monitoring }
spec:
  type: NodePort
  selector: { app: cadvisor }
  ports: [{ port: 8080, targetPort: 8080, nodePort: 30086, protocol: TCP }]