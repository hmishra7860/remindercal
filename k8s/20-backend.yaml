apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: remindercal
spec:
  replicas: 1   # scheduler jobs use DB locks, so >1 is safe, but 1 is enough for most setups
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: backend
          image: remindercal-backend:latest   # build + import: see README (K3s)
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: remindercal-config }
            - secretRef: { name: remindercal-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: remindercal
spec:
  selector: { app: backend }
  ports:
    - port: 8000
      targetPort: 8000
