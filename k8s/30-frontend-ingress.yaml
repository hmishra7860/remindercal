apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: remindercal
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: nginx
          image: remindercal-frontend:latest   # built from nginx/Dockerfile
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: remindercal
spec:
  selector: { app: frontend }
  ports:
    - port: 80
      targetPort: 80
---
# The frontend image's nginx.conf proxies /api/ to "backend:8000", which resolves
# to the backend Service in this namespace.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: remindercal
  namespace: remindercal
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # cert-manager (optional): cert-manager.io/cluster-issuer: letsencrypt
spec:
  rules:
    - host: remindercal.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
  # tls:
  #   - hosts: [remindercal.example.com]
  #     secretName: remindercal-tls
